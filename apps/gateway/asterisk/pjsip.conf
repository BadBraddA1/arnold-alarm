; Minimal PJSIP for Arnold Alarm convenience PA (ext 1010).
; Bind on LAN so UniFi Talk / softphones can reach the Pi.

[global]
type=global

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ---- Local softphone endpoint (optional test) ----
[100]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
auth=auth100
aors=aor100

[auth100]
type=auth
auth_type=userpass
username=100
password=CHANGE_ME_SOFTPHONE

[aor100]
type=aor
max_contacts=2

; ---- UniFi Talk trunk (IP-auth from Talk console) ----
; Set TALK_CONSOLE_IP in install-pa.sh / replace below.
[talk-trunk]
type=endpoint
context=from-talk
disallow=all
allow=ulaw
allow=alaw
direct_media=no
aors=aor-talk

[aor-talk]
type=aor
max_contacts=0

[talk-identify]
type=identify
endpoint=talk-trunk
match=TALK_CONSOLE_IP
