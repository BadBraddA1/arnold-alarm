; Convenience PA only — NOT for emergency codes.
; Extension 1010 answers and streams caller audio to arnold-alarm AudioSocket → Protect talkback.

[general]
static=yes
writeprotect=no

[from-internal]
; Softphones / local SIP endpoints register as 100–199
exten => 1010,1,NoOp(Arnold Alarm convenience PA)
 same => n,Answer()
 same => n,Set(UUID=${UNIQUEID})
 same => n,AudioSocket(${UUID},127.0.0.1:9092)
 same => n,Hangup()

[from-talk]
; Calls arriving from UniFi Talk third-party SIP trunk
exten => _X.,1,NoOp(Talk inbound ${EXTEN})
 same => n,Goto(from-internal,1010,1)
exten => 1010,1,Goto(from-internal,1010,1)
